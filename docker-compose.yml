services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: habit
      POSTGRES_DB: habit_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
